plugins {
    id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("release/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    testBuildType "release"
    namespace "nl.frank.simplebusdoor"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "nl.frank.simplebusdoor"
        minSdk 26
        targetSdk 36
        versionCode 206
        versionName "0.2.1"
        testInstrumentationRunner "nl.frank.simplebusdoor.HistoryClearRegression"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file("release/comelit-dooropener-release.jks")
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
